<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0b22"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pinkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43777"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#bgGrad)"/>
  <circle cx="680" cy="110" r="160" fill="#4f46e5" fill-opacity="0.18"/>
  <circle cx="140" cy="400" r="180" fill="#f43777" fill-opacity="0.14"/>
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <!-- Futuristic Hardware Core Card -->
  <rect x="80" y="75" width="360" height="240" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
  <rect x="108" y="105" width="84" height="84" rx="22" fill="url(#cyanIndigo)"/>
  <path d="M156 122L132 150H148L142 174L168 144H151L156 122Z" fill="#ffffff"/>
  <text x="212" y="140" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">NEXOVA LABS</text>
  <text x="212" y="168" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="2">PRECISION ACOUSTICS &amp; AI</text>
  <rect x="108" y="215" width="304" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="108" y="215" width="248" height="10" rx="5" fill="url(#cyanIndigo)"/>
  <text x="108" y="252" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="600">99.4% Quality Calibration Score • ISO-9001</text>
  <!-- Floating Telemetry Card -->
  <rect x="390" y="190" width="330" height="235" rx="22" fill="#141233" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="445" cy="245" r="26" fill="url(#pinkPurple)"/>
  <path d="M437 245L443 251L455 239" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="485" y="242" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">1.2M+ Global Users</text>
  <text x="485" y="264" fill="#94a3b8" font-family="sans-serif" font-size="12">Across 65+ Countries Worldwide</text>
  <!-- Bar chart inside card -->
  <rect x="430" y="345" width="28" height="45" rx="6" fill="#3b82f6" fill-opacity="0.5"/>
  <rect x="475" y="325" width="28" height="65" rx="6" fill="#3b82f6" fill-opacity="0.7"/>
  <rect x="520" y="305" width="28" height="85" rx="6" fill="#06b6d4"/>
  <rect x="565" y="290" width="28" height="100" rx="6" fill="#f43777"/>
  <rect x="610" y="275" width="28" height="115" rx="6" fill="url(#cyanIndigo)"/>
  <rect x="655" y="260" width="28" height="130" rx="6" fill="#10b981"/>
</svg>
